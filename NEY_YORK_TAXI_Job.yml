resources:
  jobs:
    NEW_YORK_TAXI_Job:
      name: NEW_YORK_TAXI_Job
      git_source:
        git_url: https://github.com/KacprusJeden/NY_Taxi_Databricks_medallion_architecture.git
        git_provider: gitHub
        git_branch: main
      tasks:
        - task_key: load_bronze
          notebook_task:
            notebook_path: load_bronze
            source: GIT
        - task_key: load_silver
          depends_on:
            - task_key: load_bronze
          notebook_task:
            notebook_path: load_silver
            source: GIT
        - task_key: load_gold
          depends_on:
            - task_key: load_silver
          notebook_task:
            notebook_path: load_gold
            source: GIT
      queue:
        enabled: true
      parameters:
        - name: date_of_data
          default: ""
        - name: run_id
          default: "{{job.run_id}}"
      performance_target: PERFORMANCE_OPTIMIZED
